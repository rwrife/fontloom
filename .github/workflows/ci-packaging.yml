name: ci-packaging

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore desktop app
        run: dotnet restore src/Fontloom.Desktop/Fontloom.Desktop.csproj

      - name: Restore test projects
        run: |
          dotnet restore tests/Fontloom.Core.Tests/Fontloom.Core.Tests.csproj
          dotnet restore tests/Fontloom.Desktop.Tests/Fontloom.Desktop.Tests.csproj

      - name: Run Fontloom.Core tests
        run: dotnet test tests/Fontloom.Core.Tests/Fontloom.Core.Tests.csproj --configuration Release

      - name: Run Fontloom.Desktop tests
        run: dotnet test tests/Fontloom.Desktop.Tests/Fontloom.Desktop.Tests.csproj --configuration Release

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    needs:
      - test
    env:
      FONTLOOM_PACKAGE_VERSION: 1.0.${{ github.run_number }}.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish win-x64
        run: >-
          dotnet publish src/Fontloom.Desktop/Fontloom.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/publish/win-x64

      - name: Build Windows artifacts (zip + msix)
        shell: pwsh
        run: >-
          ./scripts/packaging/package-windows.ps1
          -PublishDir artifacts/publish/win-x64
          -OutputDir artifacts/dist
          -Version "$env:FONTLOOM_PACKAGE_VERSION"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fontloom-windows
          path: |
            artifacts/dist/fontloom-win-x64.zip
            artifacts/dist/fontloom-win-x64.msix

  package-macos:
    name: Package macOS
    runs-on: macos-latest
    needs:
      - test
    env:
      FONTLOOM_APP_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish osx-x64
        run: >-
          dotnet publish src/Fontloom.Desktop/Fontloom.Desktop.csproj
          --configuration Release
          --runtime osx-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output artifacts/publish/osx-x64

      - name: Build macOS artifacts (.app + .dmg)
        run: >-
          ./scripts/packaging/package-macos.sh
          artifacts/publish/osx-x64
          artifacts/dist
          "$FONTLOOM_APP_VERSION"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fontloom-macos
          path: |
            artifacts/dist/fontloom-macos.app.zip
            artifacts/dist/fontloom-macos.dmg

  release:
    name: Publish tagged release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - package-windows
      - package-macos
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/fontloom-win-x64.zip
            dist/fontloom-win-x64.msix
            dist/fontloom-macos.app.zip
            dist/fontloom-macos.dmg
